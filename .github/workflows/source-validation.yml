name: Source validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate source, pins and manual release boundary
        run: python3 scripts/validate.py
      - name: Check regression harness syntax
        run: |
          for script in tests/*.sh; do bash -n "$script"; done
          for script in tests/*.mjs; do node --check "$script"; done
      - name: Check whitespace
        run: git show --format= --check HEAD
